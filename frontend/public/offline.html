<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#d97706" />
  <title>Offline · Vetrinel</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f7f5; --card: #ffffff; --fg: #1c1917; --muted: #57534e; --accent: #b45309; --border: #e7e5e4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0c0a09; --card: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --accent: #fbbf24; --border: #292524; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 16px;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Tamil", sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%; max-width: 420px; padding: 28px 24px; text-align: center;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    }
    svg { width: 48px; height: 48px; color: var(--accent); }
    h1 { font-size: 1.25rem; margin: 12px 0 4px; }
    h2 { font-size: 1.05rem; margin: 16px 0 4px; font-weight: 600; }
    p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    button {
      margin-top: 24px; width: 100%; min-height: 44px; border: 0; border-radius: 10px;
      background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { button { color: #1c1917; } }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h.01" /><path d="M8.5 16.43a5 5 0 0 1 7 0" /><path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
      <path d="M13.83 10.17A10 10 0 0 1 19 12.86" /><path d="M2 8.82a15 15 0 0 1 4.18-2.64" />
      <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" /><path d="m2 2 20 20" />
    </svg>
    <h1>You are offline</h1>
    <p>Check your internet connection. Your data is safe and will load once you are back online.</p>
    <h2 lang="ta">இணைய இணைப்பு இல்லை</h2>
    <p lang="ta">உங்கள் இணைய இணைப்பைச் சரிபார்க்கவும். இணைப்பு கிடைத்ததும் உங்கள் தகவல்கள் மீண்டும் தெரியும்.</p>
    <button type="button" onclick="location.reload()">Try again / மீண்டும் முயற்சி</button>
  </main>
</body>
</html>
